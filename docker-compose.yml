version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: toktickit_user
      POSTGRES_PASSWORD: toktickit_password
      POSTGRES_DB: toktickit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@toktickit.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
